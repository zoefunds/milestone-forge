# Fly.io config for 24/7 uptime: 2 always-on machines (no auto-stop), a
# health check gating traffic, and auto-restart on failure.
app = "milestone-forge-backend"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
